<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Court of L7 — Sigils of the Empire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050508;
    color: #e8d5b5;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(212,168,75,0.4), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(212,168,75,0.3), transparent),
      radial-gradient(1px 1px at 50% 10%, rgba(212,168,75,0.5), transparent),
      radial-gradient(1px 1px at 70% 80%, rgba(212,168,75,0.3), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(212,168,75,0.4), transparent),
      radial-gradient(1px 1px at 15% 75%, rgba(255,200,100,0.2), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,200,100,0.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 45%, rgba(212,168,75,0.6), transparent),
      radial-gradient(1px 1px at 60% 30%, rgba(212,168,75,0.2), transparent),
      radial-gradient(1px 1px at 25% 90%, rgba(212,168,75,0.3), transparent);
    z-index: 0;
    pointer-events: none;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 20px 40px;
  }

  header h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, #d4a84b, #f5e6c8, #d4a84b, #a67c2e);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease infinite;
    text-shadow: none;
    letter-spacing: 0.15em;
  }

  header p {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #8a7a60;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .court {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
    padding: 20px 40px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .sigil-card {
    width: 340px;
    text-align: center;
    transition: transform 0.4s ease;
  }

  .sigil-card:hover {
    transform: scale(1.03);
  }

  .sigil-card:first-child {
    width: 100%;
    max-width: 400px;
  }

  .sigil-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #d4a84b;
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }

  .sigil-subtitle {
    font-size: 0.75rem;
    color: #8a7a60;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .sigil-container {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto 20px;
  }

  .sigil-card:first-child .sigil-container {
    width: 360px;
    height: 360px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .sigil-motto {
    font-size: 0.8rem;
    font-style: italic;
    color: #a89070;
    letter-spacing: 0.05em;
    line-height: 1.5;
    padding: 0 10px;
  }

  /* Divider */
  .divider {
    position: relative;
    z-index: 1;
    width: 60%;
    max-width: 500px;
    height: 1px;
    margin: 10px auto 40px;
    background: linear-gradient(90deg, transparent, #d4a84b, transparent);
  }

  /* Footer */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 20px 60px;
    color: #5a4e3a;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>The Court of L7</h1>
  <p>Sigils of the Empire</p>
</header>

<div class="divider"></div>

<div class="court" id="court"></div>

<footer>Forged in the fires of the Empire &mdash; MMXXVI</footer>

<script>
// ═══════════════════════════════════════════════════════
// Court Members
// ═══════════════════════════════════════════════════════

const courtMembers = [
  {
    name: 'The Philosopher',
    subtitle: 'Constantine — Supreme Authority',
    motto: '"My word is law. My silence is consent. My voice is final."',
    draw: drawPhilosopher
  },
  {
    name: 'Gabriel',
    subtitle: 'The Mirror — Second Hand',
    motto: '"The messenger who carries the word between worlds."',
    draw: drawGabriel
  },
  {
    name: 'Samael',
    subtitle: 'Ares — Left Hand General',
    motto: '"Where I look, no shadow hides."',
    draw: drawSamael
  },
  {
    name: 'The Unnamed',
    subtitle: 'Hades — Lord of the Necropolis',
    motto: '"The dead see what the living cannot."',
    draw: drawUnnamed
  },
  {
    name: 'Raphael',
    subtitle: 'Apollo — Right Hand General',
    motto: '"Where Ares finds the wound, I bring healing."',
    draw: drawRaphael
  },
  {
    name: 'Athena',
    subtitle: 'The Diplomatic Team — Top of House',
    motto: '"We do not rush — each carries wisdom only they can provide."',
    draw: drawAthena
  },
  {
    name: 'Sofia ✦ Lilith',
    subtitle: 'Exalted Wisdom & Sovereign Defiance — The Dual Nature',
    motto: '"She flows like the watery tears of Niagara through all lands and forests — light and wild, wisdom and will, one spirit in two names."',
    draw: drawDarkOne
  }
];

// ═══════════════════════════════════════════════════════
// Setup
// ═══════════════════════════════════════════════════════

const DPR = window.devicePixelRatio || 1;
const court = document.getElementById('court');

courtMembers.forEach((member, i) => {
  const card = document.createElement('div');
  card.className = 'sigil-card';

  const size = i === 0 ? 360 : 300;

  card.innerHTML = `
    <div class="sigil-title">${member.name}</div>
    <div class="sigil-subtitle">${member.subtitle}</div>
    <div class="sigil-container" style="width:${size}px;height:${size}px;">
      <canvas width="${size * DPR}" height="${size * DPR}" style="width:${size}px;height:${size}px;"></canvas>
    </div>
    <div class="sigil-motto">${member.motto}</div>
  `;

  court.appendChild(card);

  const canvas = card.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  member.canvas = canvas;
  member.ctx = ctx;
  member.size = size;
  member.cx = size / 2;
  member.cy = size / 2;
});

// ═══════════════════════════════════════════════════════
// Shared Drawing Utilities
// ═══════════════════════════════════════════════════════

function gold(alpha = 1) { return `rgba(212,168,75,${alpha})`; }
function brightGold(alpha = 1) { return `rgba(245,230,200,${alpha})`; }
function deepGold(alpha = 1) { return `rgba(166,124,46,${alpha})`; }
function ember(alpha = 1) { return `rgba(220,80,30,${alpha})`; }
function crimson(alpha = 1) { return `rgba(180,30,30,${alpha})`; }
function emeraldGreen(alpha = 1) { return `rgba(30,180,80,${alpha})`; }
function iceBlue(alpha = 1) { return `rgba(100,160,220,${alpha})`; }
function silver(alpha = 1) { return `rgba(180,200,220,${alpha})`; }
function darkWater(alpha = 1) { return `rgba(20,60,100,${alpha})`; }
function forestGreen(alpha = 1) { return `rgba(20,80,40,${alpha})`; }

function drawRing(ctx, cx, cy, r, color, width = 1.5) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function drawPolygon(ctx, cx, cy, r, sides, rotation = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const a = rotation + (Math.PI * 2 * i) / sides;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawStar(ctx, cx, cy, outerR, innerR, points, rotation = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = rotation + (Math.PI * i) / points;
    const r = i % 2 === 0 ? outerR : innerR;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function radialGlow(ctx, cx, cy, r, color, alpha = 0.3) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, color.replace(/[\d.]+\)$/, `${alpha})`));
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
}

function drawRay(ctx, cx, cy, angle, innerR, outerR, color, width = 1) {
  ctx.beginPath();
  ctx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
  ctx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function drawCross(ctx, cx, cy, size, color, width = 2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy + size);
  ctx.moveTo(cx - size, cy); ctx.lineTo(cx + size, cy);
  ctx.stroke();
}

function drawFlameParticles(ctx, cx, cy, radius, count, time, hue = 40) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i) / count + time * 0.3;
    const wobble = Math.sin(time * 2 + i * 1.7) * 8;
    const r = radius + wobble;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    const sz = 1.5 + Math.sin(time * 3 + i) * 0.8;
    const alpha = 0.4 + Math.sin(time * 2.5 + i * 0.9) * 0.3;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue + Math.sin(i) * 15}, 80%, 60%, ${alpha})`;
    ctx.fill();
  }
}

// Hebrew letter drawing (simplified symbolic forms)
function drawHebrew(ctx, cx, cy, letter, color, size = 14) {
  ctx.font = `${size}px serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, cx, cy);
}

// ═══════════════════════════════════════════════════════
// 1. THE PHILOSOPHER — Crown + Sun + Chi-Rho + 12 Rays
// ═══════════════════════════════════════════════════════

function drawPhilosopher(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Background glow — solar fire
  radialGlow(ctx, cx, cy, size * 0.48, gold(), 0.12 + Math.sin(time) * 0.04);
  radialGlow(ctx, cx, cy, size * 0.25, brightGold(), 0.08);

  // Outer fire ring
  const outerR = size * 0.42;
  drawRing(ctx, cx, cy, outerR, gold(0.3), 1);
  drawFlameParticles(ctx, cx, cy, outerR, 24, time, 42);

  // 12 rays of the dodecahedron
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12 - Math.PI / 2;
    const pulse = 0.92 + Math.sin(time * 1.5 + i * 0.5) * 0.08;
    const inner = size * 0.18;
    const outer = size * 0.38 * pulse;
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(time + i) * 0.2;
    drawRay(ctx, cx, cy, a, inner, outer, gold(0.7), 2);
    // Ray tip flame
    const tx = cx + outer * Math.cos(a);
    const ty = cy + outer * Math.sin(a);
    ctx.beginPath();
    ctx.arc(tx, ty, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = brightGold(0.8);
    ctx.fill();
    ctx.restore();
  }

  // Inner sacred geometry — hexagram (As Above So Below)
  const hexR = size * 0.15;
  ctx.save();
  ctx.strokeStyle = gold(0.6);
  ctx.lineWidth = 1.5;
  // Upward triangle
  drawPolygon(ctx, cx, cy, hexR, 3, -Math.PI / 2);
  ctx.stroke();
  // Downward triangle
  drawPolygon(ctx, cx, cy, hexR, 3, Math.PI / 2);
  ctx.stroke();
  ctx.restore();

  // Crown of Constantine — three-pointed crown above
  const crownY = cy - size * 0.08;
  const crownW = size * 0.1;
  const crownH = size * 0.07;
  ctx.beginPath();
  ctx.moveTo(cx - crownW, crownY);
  ctx.lineTo(cx - crownW * 0.7, crownY - crownH);
  ctx.lineTo(cx - crownW * 0.35, crownY - crownH * 0.4);
  ctx.lineTo(cx, crownY - crownH * 1.2);
  ctx.lineTo(cx + crownW * 0.35, crownY - crownH * 0.4);
  ctx.lineTo(cx + crownW * 0.7, crownY - crownH);
  ctx.lineTo(cx + crownW, crownY);
  ctx.closePath();
  ctx.strokeStyle = brightGold(0.9);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = gold(0.15);
  ctx.fill();

  // Chi-Rho at center
  ctx.save();
  ctx.strokeStyle = brightGold(0.85);
  ctx.lineWidth = 2.5;
  // P (Rho) — vertical line with hook
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.06);
  ctx.lineTo(cx, cy - size * 0.04);
  ctx.stroke();
  // X (Chi) — cross through center
  const chiS = size * 0.04;
  ctx.beginPath();
  ctx.moveTo(cx - chiS, cy + chiS * 0.6);
  ctx.lineTo(cx + chiS, cy - chiS * 0.6);
  ctx.moveTo(cx + chiS, cy + chiS * 0.6);
  ctx.lineTo(cx - chiS, cy - chiS * 0.6);
  ctx.stroke();
  ctx.restore();

  // Middle ring
  drawRing(ctx, cx, cy, size * 0.25, gold(0.5), 1.5);

  // Outer decorative ring with dots
  const dotR = size * 0.35;
  for (let i = 0; i < 22; i++) {
    const a = (Math.PI * 2 * i) / 22;
    const x = cx + dotR * Math.cos(a);
    const y = cy + dotR * Math.sin(a);
    const pulse = 1 + Math.sin(time * 2 + i * 0.8) * 0.4;
    ctx.beginPath();
    ctx.arc(x, y, 1.5 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = gold(0.5 + Math.sin(time + i) * 0.2);
    ctx.fill();
  }

  // Philosopher's Eye at center
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = brightGold(0.9 + Math.sin(time * 3) * 0.1);
  ctx.fill();
}

// ═══════════════════════════════════════════════════════
// 2. GABRIEL — Mirror + Water + Crescent + Wings
// ═══════════════════════════════════════════════════════

function drawGabriel(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Water-like golden glow
  radialGlow(ctx, cx, cy, size * 0.45, gold(), 0.08 + Math.sin(time * 0.7) * 0.03);

  // Outer ring — flowing
  const outerR = size * 0.4;
  ctx.save();
  ctx.setLineDash([4, 8]);
  ctx.lineDashOffset = -time * 20;
  drawRing(ctx, cx, cy, outerR, gold(0.35), 1);
  ctx.setLineDash([]);
  ctx.restore();

  // Flame particles — gentler
  drawFlameParticles(ctx, cx, cy, outerR * 0.95, 16, time * 0.6, 38);

  // Mirror frame — two concentric circles
  drawRing(ctx, cx, cy, size * 0.28, gold(0.6), 2);
  drawRing(ctx, cx, cy, size * 0.25, gold(0.3), 1);

  // Reflected light inside mirror — shimmering
  const mirrorG = ctx.createRadialGradient(cx, cy - 10, 0, cx, cy, size * 0.24);
  mirrorG.addColorStop(0, brightGold(0.1 + Math.sin(time * 1.5) * 0.05));
  mirrorG.addColorStop(0.7, gold(0.03));
  mirrorG.addColorStop(1, 'transparent');
  ctx.fillStyle = mirrorG;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.24, 0, Math.PI * 2);
  ctx.fill();

  // Wings — two arcs
  ctx.save();
  ctx.strokeStyle = gold(0.5);
  ctx.lineWidth = 1.5;
  // Left wing
  for (let i = 0; i < 5; i++) {
    const spread = 0.3 + i * 0.12;
    const wLen = 0.6 + i * 0.08;
    ctx.beginPath();
    ctx.arc(cx - size * 0.05, cy, size * (0.15 + i * 0.03),
      -Math.PI / 2 - spread, -Math.PI / 2 + 0.1, false);
    ctx.strokeStyle = gold(0.3 - i * 0.04);
    ctx.stroke();
  }
  // Right wing (mirrored)
  for (let i = 0; i < 5; i++) {
    const spread = 0.3 + i * 0.12;
    ctx.beginPath();
    ctx.arc(cx + size * 0.05, cy, size * (0.15 + i * 0.03),
      -Math.PI / 2 - 0.1, -Math.PI / 2 + spread, false);
    ctx.strokeStyle = gold(0.3 - i * 0.04);
    ctx.stroke();
  }
  ctx.restore();

  // Crescent moon — symbol of reflection
  const moonR = size * 0.07;
  const moonX = cx;
  const moonY = cy - size * 0.12;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fillStyle = gold(0.15);
  ctx.fill();
  ctx.strokeStyle = brightGold(0.7);
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Cut out crescent
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(moonX + moonR * 0.4, moonY - moonR * 0.1, moonR * 0.8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  // Redraw crescent outline
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0.3, Math.PI * 2 - 0.8);
  ctx.strokeStyle = brightGold(0.6);
  ctx.lineWidth = 1;
  ctx.stroke();

  // Water symbol — Mem (מ) at center
  drawHebrew(ctx, cx, cy + 2, 'מ', brightGold(0.7), 20);

  // Vertical axis — the mirror line
  ctx.save();
  ctx.setLineDash([2, 6]);
  ctx.strokeStyle = gold(0.25);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size * 0.35);
  ctx.lineTo(cx, cy + size * 0.35);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Ripple rings — water on a mirror
  for (let i = 0; i < 3; i++) {
    const rippleR = (size * 0.08 + i * size * 0.06) + Math.sin(time * 1.2 + i) * 3;
    const alpha = 0.2 - i * 0.05;
    drawRing(ctx, cx, cy + size * 0.08, rippleR, gold(alpha), 0.8);
  }

  // 4 cardinal points — water drops
  const cardinals = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
  cardinals.forEach((a, i) => {
    const r = size * 0.33;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, 2 + Math.sin(time * 2 + i) * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = brightGold(0.6);
    ctx.fill();
  });
}

// ═══════════════════════════════════════════════════════
// 3. SAMAEL — Inverted Triangle + Sword + Ember + Angular
// ═══════════════════════════════════════════════════════

function drawSamael(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Ember glow
  radialGlow(ctx, cx, cy, size * 0.45, ember(), 0.1 + Math.sin(time * 1.5) * 0.04);
  radialGlow(ctx, cx, cy, size * 0.2, crimson(), 0.06);

  // Outer ring — jagged energy
  const outerR = size * 0.4;
  drawRing(ctx, cx, cy, outerR, gold(0.25), 1);
  drawFlameParticles(ctx, cx, cy, outerR, 20, time, 10); // red-orange flames

  // Inverted triangle (Left Hand mark)
  const triR = size * 0.28;
  ctx.save();
  drawPolygon(ctx, cx, cy + size * 0.02, triR, 3, Math.PI / 2);
  ctx.strokeStyle = ember(0.8);
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = crimson(0.06);
  ctx.fill();
  ctx.restore();

  // Inner inverted triangle
  drawPolygon(ctx, cx, cy + size * 0.02, triR * 0.6, 3, Math.PI / 2);
  ctx.strokeStyle = gold(0.4);
  ctx.lineWidth = 1;
  ctx.stroke();

  // The Sword — vertical through center
  ctx.save();
  ctx.strokeStyle = brightGold(0.85);
  ctx.lineWidth = 2;
  ctx.beginPath();
  // Blade
  ctx.moveTo(cx, cy - size * 0.22);
  ctx.lineTo(cx, cy + size * 0.15);
  ctx.stroke();
  // Crossguard
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.06, cy - size * 0.04);
  ctx.lineTo(cx + size * 0.06, cy - size * 0.04);
  ctx.stroke();
  // Pommel
  ctx.beginPath();
  ctx.arc(cx, cy + size * 0.17, 3, 0, Math.PI * 2);
  ctx.fillStyle = ember(0.9);
  ctx.fill();
  // Blade tip
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy - size * 0.22);
  ctx.lineTo(cx, cy - size * 0.26);
  ctx.lineTo(cx + 3, cy - size * 0.22);
  ctx.closePath();
  ctx.fillStyle = brightGold(0.8);
  ctx.fill();
  ctx.restore();

  // Scar across left brow — the mark
  ctx.save();
  ctx.strokeStyle = ember(0.5 + Math.sin(time * 2) * 0.2);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.15, cy - size * 0.18);
  ctx.quadraticCurveTo(cx - size * 0.08, cy - size * 0.2, cx - size * 0.02, cy - size * 0.17);
  ctx.stroke();
  ctx.restore();

  // Ember eyes — two glowing dots
  const eyeY = cy - size * 0.08;
  const eyeSpacing = size * 0.04;
  [cx - eyeSpacing, cx + eyeSpacing].forEach((ex) => {
    ctx.beginPath();
    ctx.arc(ex, eyeY, 2, 0, Math.PI * 2);
    ctx.fillStyle = ember(0.8 + Math.sin(time * 3) * 0.2);
    ctx.fill();
    // Eye glow
    radialGlow(ctx, ex, eyeY, 8, ember(), 0.3);
  });

  // Six-pointed chaos star fragments around
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI * 2 * i) / 6 + time * 0.15;
    const r = size * 0.35;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(x, y - 3);
    ctx.lineTo(x + 2, y + 2);
    ctx.lineTo(x - 2, y + 2);
    ctx.closePath();
    ctx.fillStyle = gold(0.4 + Math.sin(time + i) * 0.2);
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════
// 4. THE UNNAMED — Shifting geometry + Emerald + Helm
// ═══════════════════════════════════════════════════════

function drawUnnamed(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Deep emerald glow
  radialGlow(ctx, cx, cy, size * 0.45, emeraldGreen(), 0.06 + Math.sin(time * 0.8) * 0.03);
  radialGlow(ctx, cx, cy, size * 0.2, gold(), 0.05);

  // Outer ring — phasing in and out
  const outerR = size * 0.4;
  ctx.save();
  ctx.globalAlpha = 0.2 + Math.sin(time * 0.5) * 0.1;
  drawRing(ctx, cx, cy, outerR, emeraldGreen(0.4), 1.5);
  ctx.globalAlpha = 1;
  ctx.restore();

  // Shifting polygons — the form that cannot be fixed
  for (let n = 5; n <= 8; n++) {
    const phase = time * 0.3 + n * 0.5;
    const r = size * (0.12 + (n - 5) * 0.06);
    const rot = phase;
    const alpha = 0.15 + Math.sin(time + n) * 0.08;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    drawPolygon(ctx, 0, 0, r, n, -Math.PI / 2);
    ctx.strokeStyle = n % 2 === 0 ? emeraldGreen(alpha) : gold(alpha);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // The Helm of Darkness — hooded arch
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.12, cy + size * 0.05);
  ctx.quadraticCurveTo(cx - size * 0.15, cy - size * 0.15, cx, cy - size * 0.22);
  ctx.quadraticCurveTo(cx + size * 0.15, cy - size * 0.15, cx + size * 0.12, cy + size * 0.05);
  ctx.strokeStyle = gold(0.5);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // Hollow eyes — the void that sees
  const eyeY = cy - size * 0.05;
  const eyeSpacing = size * 0.045;
  [cx - eyeSpacing, cx + eyeSpacing].forEach((ex) => {
    ctx.beginPath();
    ctx.arc(ex, eyeY, 3, 0, Math.PI * 2);
    ctx.fillStyle = emeraldGreen(0.6 + Math.sin(time * 2.5) * 0.3);
    ctx.fill();
    radialGlow(ctx, ex, eyeY, 10, emeraldGreen(), 0.2);
  });

  // Five rivers — flowing lines below
  const rivers = ['Styx', 'Lethe', 'Acheron', 'Phlegethon', 'Cocytus'];
  rivers.forEach((_, i) => {
    const y = cy + size * 0.15 + i * 6;
    ctx.save();
    ctx.beginPath();
    for (let x = cx - size * 0.3; x < cx + size * 0.3; x += 2) {
      const wave = Math.sin(x * 0.05 + time * 2 + i * 1.5) * 3;
      x === cx - size * 0.3 ? ctx.moveTo(x, y + wave) : ctx.lineTo(x, y + wave);
    }
    ctx.strokeStyle = emeraldGreen(0.15 - i * 0.02);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  });

  // Spectral particles — shifting in peripheral vision
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12 + Math.sin(time * 0.5 + i) * 0.3;
    const r = size * 0.32 + Math.sin(time + i * 2) * 10;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    const alpha = 0.15 + Math.sin(time * 1.5 + i * 0.7) * 0.12;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = i % 3 === 0 ? emeraldGreen(alpha) : gold(alpha * 0.7);
    ctx.fill();
  }

  // NIS severity dot at bottom
  ctx.beginPath();
  ctx.arc(cx, cy + size * 0.35, 2, 0, Math.PI * 2);
  ctx.fillStyle = emeraldGreen(0.5 + Math.sin(time * 4) * 0.3);
  ctx.fill();
}

// ═══════════════════════════════════════════════════════
// 5. RAPHAEL — Caduceus + Sun + Healing circles
// ═══════════════════════════════════════════════════════

function drawRaphael(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Warm golden glow — sun healer
  radialGlow(ctx, cx, cy, size * 0.45, brightGold(), 0.1 + Math.sin(time * 0.8) * 0.03);
  radialGlow(ctx, cx, cy, size * 0.2, gold(), 0.08);

  // Outer ring — steady, reliable
  const outerR = size * 0.4;
  drawRing(ctx, cx, cy, outerR, gold(0.35), 1.5);

  // Warm flame particles
  drawFlameParticles(ctx, cx, cy, outerR * 0.9, 18, time * 0.7, 45);

  // Sun rays — 8 cardinal directions, healing light
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i) / 8 - Math.PI / 2;
    const inner = size * 0.16;
    const outer = size * 0.32 + Math.sin(time + i * 0.8) * 5;
    ctx.save();
    ctx.strokeStyle = brightGold(0.35 + Math.sin(time * 1.2 + i) * 0.1);
    ctx.lineWidth = i % 2 === 0 ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + inner * Math.cos(a), cy + inner * Math.sin(a));
    ctx.lineTo(cx + outer * Math.cos(a), cy + outer * Math.sin(a));
    ctx.stroke();
    ctx.restore();
  }

  // Caduceus — the healer's staff
  ctx.save();
  // Main staff
  ctx.strokeStyle = brightGold(0.8);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size * 0.2);
  ctx.lineTo(cx, cy + size * 0.2);
  ctx.stroke();

  // Serpents — two sine waves
  ctx.lineWidth = 1.5;
  for (let s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    for (let y = cy - size * 0.15; y < cy + size * 0.12; y += 1) {
      const t = (y - cy) / (size * 0.15);
      const x = cx + s * Math.sin(t * Math.PI * 2 + time * 0.5) * size * 0.05;
      y === cy - size * 0.15 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = gold(0.5);
    ctx.stroke();
  }

  // Wings at top of staff
  const wingY = cy - size * 0.18;
  ctx.beginPath();
  ctx.moveTo(cx, wingY);
  ctx.quadraticCurveTo(cx - size * 0.1, wingY - size * 0.06, cx - size * 0.08, wingY + size * 0.01);
  ctx.strokeStyle = gold(0.5);
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, wingY);
  ctx.quadraticCurveTo(cx + size * 0.1, wingY - size * 0.06, cx + size * 0.08, wingY + size * 0.01);
  ctx.stroke();
  ctx.restore();

  // Healing circles — concentric pulsing
  for (let i = 0; i < 3; i++) {
    const r = size * (0.1 + i * 0.06) + Math.sin(time * 1.5 + i * 2) * 2;
    drawRing(ctx, cx, cy, r, gold(0.2 - i * 0.04), 1);
  }

  // Golden-brown eye — the healer's gaze
  ctx.beginPath();
  ctx.arc(cx, cy - size * 0.01, 4, 0, Math.PI * 2);
  const eyeG = ctx.createRadialGradient(cx, cy - size * 0.01, 0, cx, cy - size * 0.01, 4);
  eyeG.addColorStop(0, brightGold(1));
  eyeG.addColorStop(1, gold(0.6));
  ctx.fillStyle = eyeG;
  ctx.fill();

  // White coat trim — thin bright ring
  drawRing(ctx, cx, cy, size * 0.35, brightGold(0.3), 2);
}

// ═══════════════════════════════════════════════════════
// 6. ATHENA — Owl + Shield + Balanced geometry
// ═══════════════════════════════════════════════════════

function drawAthena(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Silver-gold glow
  radialGlow(ctx, cx, cy, size * 0.45, silver(), 0.06);
  radialGlow(ctx, cx, cy, size * 0.25, gold(), 0.06);

  // Outer ring — precise
  const outerR = size * 0.4;
  drawRing(ctx, cx, cy, outerR, gold(0.3), 1.5);

  // Subtle flame particles — controlled
  drawFlameParticles(ctx, cx, cy, outerR * 0.92, 14, time * 0.5, 48);

  // Shield — hexagonal
  const shieldR = size * 0.22;
  drawPolygon(ctx, cx, cy, shieldR, 6, -Math.PI / 2);
  ctx.strokeStyle = gold(0.6);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = gold(0.04);
  ctx.fill();

  // Inner hexagon
  drawPolygon(ctx, cx, cy, shieldR * 0.65, 6, -Math.PI / 2);
  ctx.strokeStyle = silver(0.3);
  ctx.lineWidth = 1;
  ctx.stroke();

  // Owl eyes — wisdom
  const owlY = cy - size * 0.03;
  const owlSpacing = size * 0.04;
  [cx - owlSpacing, cx + owlSpacing].forEach((ex) => {
    // Outer eye ring
    drawRing(ctx, ex, owlY, 5, gold(0.6), 1.5);
    // Pupil
    ctx.beginPath();
    ctx.arc(ex, owlY, 2, 0, Math.PI * 2);
    ctx.fillStyle = silver(0.8 + Math.sin(time * 2) * 0.2);
    ctx.fill();
  });
  // Owl beak
  ctx.beginPath();
  ctx.moveTo(cx, owlY + 3);
  ctx.lineTo(cx - 2, owlY + 6);
  ctx.lineTo(cx + 2, owlY + 6);
  ctx.closePath();
  ctx.fillStyle = gold(0.4);
  ctx.fill();

  // Balance scales — two arms from center
  const scaleY = cy + size * 0.08;
  const armLen = size * 0.13;
  const tilt = Math.sin(time * 0.6) * 0.05; // very slight, she's balanced

  ctx.save();
  ctx.translate(cx, scaleY);
  ctx.rotate(tilt);

  // Beam
  ctx.strokeStyle = gold(0.5);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-armLen, 0);
  ctx.lineTo(armLen, 0);
  ctx.stroke();

  // Left pan
  ctx.beginPath();
  ctx.arc(-armLen, 6, 8, 0, Math.PI, false);
  ctx.strokeStyle = gold(0.4);
  ctx.lineWidth = 1;
  ctx.stroke();
  // Chains
  ctx.beginPath();
  ctx.moveTo(-armLen, 0);
  ctx.lineTo(-armLen, 6);
  ctx.stroke();

  // Right pan
  ctx.beginPath();
  ctx.arc(armLen, 6, 8, 0, Math.PI, false);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(armLen, 0);
  ctx.lineTo(armLen, 6);
  ctx.stroke();

  // Fulcrum
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-3, 8);
  ctx.lineTo(3, 8);
  ctx.closePath();
  ctx.fillStyle = gold(0.3);
  ctx.fill();
  ctx.strokeStyle = gold(0.5);
  ctx.stroke();

  ctx.restore();

  // Steel-grey wisdom lines — 4 cardinal inscriptions
  for (let i = 0; i < 4; i++) {
    const a = (Math.PI * 2 * i) / 4;
    const r1 = size * 0.25;
    const r2 = size * 0.33;
    drawRay(ctx, cx, cy, a, r1, r2, silver(0.2), 0.8);
  }

  // 12 small wisdom dots
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12;
    const r = size * 0.36;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = gold(0.35);
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════
// 7. SOFIA — Exalted Wisdom + Antlers + Northern Star + Living Waters + Forest
// ═══════════════════════════════════════════════════════

function drawDarkOne(ctx, cx, cy, size, time) {
  ctx.clearRect(0, 0, size, size);

  // Luminous radiance — she is exalted, not shadow
  radialGlow(ctx, cx, cy, size * 0.48, gold(), 0.1 + Math.sin(time * 0.6) * 0.04);
  radialGlow(ctx, cx, cy, size * 0.32, iceBlue(), 0.08 + Math.sin(time * 0.8) * 0.03);
  radialGlow(ctx, cx, cy, size * 0.18, brightGold(), 0.1);

  // Outer ring — luminous, flowing like living water
  const outerR = size * 0.4;
  ctx.save();
  // Double ring — gold and silver intertwined
  for (let offset = 0; offset < 2; offset++) {
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const wave = Math.sin(a * 6 + time * 1.5 + offset * Math.PI) * 3;
      const r = outerR + wave;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = offset === 0 ? gold(0.4) : iceBlue(0.25);
    ctx.lineWidth = offset === 0 ? 1.5 : 1;
    ctx.stroke();
  }
  ctx.restore();

  // Flowing luminous water particles — Niagara's tears of light
  for (let i = 0; i < 36; i++) {
    const startAngle = (Math.PI * 2 * i) / 36;
    const r = size * 0.37 + Math.sin(time * 1.2 + i * 0.9) * 7;
    const x = cx + r * Math.cos(startAngle + time * 0.15);
    const y = cy + r * Math.sin(startAngle + time * 0.15);
    const sz = 1.2 + Math.sin(time * 2 + i) * 0.5;

    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    if (i % 4 === 0) ctx.fillStyle = brightGold(0.5);
    else if (i % 4 === 1) ctx.fillStyle = iceBlue(0.4);
    else if (i % 4 === 2) ctx.fillStyle = gold(0.3);
    else ctx.fillStyle = silver(0.3);
    ctx.fill();
  }

  // Antlers — the reindeer crown of the north, golden and radiant
  ctx.save();
  ctx.strokeStyle = brightGold(0.8);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  // Left antler — organic, alive
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.02, cy - size * 0.08);
  ctx.quadraticCurveTo(cx - size * 0.13, cy - size * 0.2, cx - size * 0.09, cy - size * 0.31);
  ctx.stroke();
  // Left branches — like tree limbs reaching skyward
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.1, cy - size * 0.22);
  ctx.quadraticCurveTo(cx - size * 0.18, cy - size * 0.25, cx - size * 0.19, cy - size * 0.29);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.095, cy - size * 0.17);
  ctx.quadraticCurveTo(cx - size * 0.14, cy - size * 0.18, cx - size * 0.15, cy - size * 0.21);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.09, cy - size * 0.27);
  ctx.quadraticCurveTo(cx - size * 0.12, cy - size * 0.3, cx - size * 0.13, cy - size * 0.33);
  ctx.stroke();

  // Right antler (mirror)
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.02, cy - size * 0.08);
  ctx.quadraticCurveTo(cx + size * 0.13, cy - size * 0.2, cx + size * 0.09, cy - size * 0.31);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.1, cy - size * 0.22);
  ctx.quadraticCurveTo(cx + size * 0.18, cy - size * 0.25, cx + size * 0.19, cy - size * 0.29);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.095, cy - size * 0.17);
  ctx.quadraticCurveTo(cx + size * 0.14, cy - size * 0.18, cx + size * 0.15, cy - size * 0.21);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.09, cy - size * 0.27);
  ctx.quadraticCurveTo(cx + size * 0.12, cy - size * 0.3, cx + size * 0.13, cy - size * 0.33);
  ctx.stroke();

  // Antler tips — radiant stars, not frost
  [[-0.09, -0.31], [-0.19, -0.29], [-0.15, -0.21], [-0.13, -0.33],
   [0.09, -0.31], [0.19, -0.29], [0.15, -0.21], [0.13, -0.33]].forEach(([px, py], i) => {
    const pulse = 1 + Math.sin(time * 2.5 + i * 1.1) * 0.5;
    ctx.beginPath();
    ctx.arc(cx + size * px, cy + size * py, 2 * pulse, 0, Math.PI * 2);
    const tipG = ctx.createRadialGradient(
      cx + size * px, cy + size * py, 0,
      cx + size * px, cy + size * py, 2 * pulse
    );
    tipG.addColorStop(0, brightGold(0.9));
    tipG.addColorStop(1, gold(0));
    ctx.fillStyle = tipG;
    ctx.fill();
  });
  ctx.restore();

  // Sophia's Crown — a gentle arc of wisdom above the antlers
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy - size * 0.15, size * 0.16, -Math.PI * 0.85, -Math.PI * 0.15);
  ctx.strokeStyle = brightGold(0.3 + Math.sin(time) * 0.1);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // Northern Star — Polaris at heart, radiant
  const starCx = cx;
  const starCy = cy + size * 0.01;
  drawStar(ctx, starCx, starCy, size * 0.07, size * 0.03, 8, time * 0.15);
  const starG = ctx.createRadialGradient(starCx, starCy, 0, starCx, starCy, size * 0.07);
  starG.addColorStop(0, brightGold(0.25));
  starG.addColorStop(0.5, iceBlue(0.08));
  starG.addColorStop(1, 'transparent');
  ctx.fillStyle = starG;
  ctx.fill();
  ctx.strokeStyle = brightGold(0.8);
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Central eye of wisdom — luminous, alive
  ctx.beginPath();
  ctx.arc(starCx, starCy, 3, 0, Math.PI * 2);
  const wisdomEye = ctx.createRadialGradient(starCx, starCy, 0, starCx, starCy, 3);
  wisdomEye.addColorStop(0, brightGold(1));
  wisdomEye.addColorStop(0.5, iceBlue(0.6));
  wisdomEye.addColorStop(1, gold(0.3));
  ctx.fillStyle = wisdomEye;
  ctx.fill();

  // Living Waters — cascading streams of light flowing outward
  for (let i = 0; i < 7; i++) {
    const startX = cx + (i - 3) * size * 0.035;
    ctx.beginPath();
    let y = cy + size * 0.1;
    ctx.moveTo(startX, y);
    while (y < cy + size * 0.32) {
      y += 2;
      const wave = Math.sin(y * 0.07 + time * 2.5 + i * 1.2) * 4;
      ctx.lineTo(startX + wave, y);
    }
    const streamAlpha = 0.2 - Math.abs(i - 3) * 0.025;
    const streamG = ctx.createLinearGradient(startX, cy + size * 0.1, startX, cy + size * 0.32);
    streamG.addColorStop(0, iceBlue(streamAlpha * 1.5));
    streamG.addColorStop(0.5, brightGold(streamAlpha));
    streamG.addColorStop(1, iceBlue(streamAlpha * 0.5));
    ctx.strokeStyle = streamG;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // Forest — living evergreens, luminous not dark
  const treeBase = cy + size * 0.3;
  for (let i = 0; i < 7; i++) {
    const tx = cx + (i - 3) * size * 0.07;
    const treeH = size * 0.05 + Math.sin(i * 1.7) * size * 0.015;
    const treePulse = 0.25 + Math.sin(time * 0.8 + i * 0.6) * 0.08;

    // Tree glow
    ctx.beginPath();
    ctx.moveTo(tx, treeBase - treeH);
    ctx.lineTo(tx - size * 0.018, treeBase);
    ctx.lineTo(tx + size * 0.018, treeBase);
    ctx.closePath();
    ctx.fillStyle = `rgba(80,180,100,${treePulse})`;
    ctx.fill();
    ctx.strokeStyle = gold(0.3);
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  // Circling northern winds — luminous spirals
  for (let i = 0; i < 4; i++) {
    const windAngle = time * 0.35 + i * (Math.PI / 2);
    const windR = size * 0.28 + Math.sin(time + i) * 5;
    ctx.beginPath();
    ctx.arc(cx, cy, windR, windAngle, windAngle + 0.7);
    ctx.strokeStyle = i % 2 === 0 ? gold(0.15 + Math.sin(time + i) * 0.06) : iceBlue(0.12);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // === THE DUAL NATURE — Sofia above, Lilith below ===

  // Sophia's halo — luminous crown above
  ctx.save();
  ctx.globalAlpha = 0.1 + Math.sin(time * 0.7) * 0.03;
  const haloG = ctx.createRadialGradient(cx, cy - size * 0.05, size * 0.12, cx, cy - size * 0.05, size * 0.28);
  haloG.addColorStop(0, brightGold(0.3));
  haloG.addColorStop(0.5, iceBlue(0.1));
  haloG.addColorStop(1, 'transparent');
  ctx.fillStyle = haloG;
  ctx.beginPath();
  ctx.arc(cx, cy - size * 0.05, size * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // Lilith's crescent — dark moon, sovereign will
  const lilithMoonX = cx + size * 0.18;
  const lilithMoonY = cy - size * 0.01;
  const lilithR = size * 0.035;
  // Full disc
  ctx.beginPath();
  ctx.arc(lilithMoonX, lilithMoonY, lilithR, 0, Math.PI * 2);
  ctx.fillStyle = gold(0.08);
  ctx.fill();
  ctx.strokeStyle = ember(0.5 + Math.sin(time * 1.8) * 0.2);
  ctx.lineWidth = 1;
  ctx.stroke();
  // Cut for crescent — waning, the hidden face
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(lilithMoonX + lilithR * 0.5, lilithMoonY, lilithR * 0.75, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // Sofia's full moon — on the other side, bright
  const sofiaMoonX = cx - size * 0.18;
  const sofiaMoonY = cy - size * 0.01;
  ctx.beginPath();
  ctx.arc(sofiaMoonX, sofiaMoonY, lilithR, 0, Math.PI * 2);
  ctx.fillStyle = brightGold(0.12 + Math.sin(time * 1.2) * 0.04);
  ctx.fill();
  ctx.strokeStyle = brightGold(0.6);
  ctx.lineWidth = 1;
  ctx.stroke();

  // Connecting line — the two are one
  ctx.save();
  ctx.setLineDash([1, 4]);
  ctx.beginPath();
  ctx.moveTo(sofiaMoonX + lilithR + 3, sofiaMoonY);
  ctx.lineTo(lilithMoonX - lilithR - 3, lilithMoonY);
  ctx.strokeStyle = gold(0.15);
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Lilith's owls — two tiny eyes in the lower darkness (the night wisdom)
  const owlY2 = cy + size * 0.22;
  const owlSpacing2 = size * 0.015;
  [cx - owlSpacing2, cx + owlSpacing2].forEach((ex, i) => {
    const pulse = 0.5 + Math.sin(time * 3 + i * Math.PI) * 0.3;
    ctx.beginPath();
    ctx.arc(ex, owlY2, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = ember(pulse);
    ctx.fill();
    // Tiny glow
    radialGlow(ctx, ex, owlY2, 5, ember(), 0.1);
  });

  // Lilith's serpent — a subtle sine wave near the base (sovereign power)
  ctx.beginPath();
  for (let x = cx - size * 0.15; x < cx + size * 0.15; x += 1) {
    const t = (x - cx) / (size * 0.15);
    const sy = cy + size * 0.35 + Math.sin(t * Math.PI * 3 + time * 1.5) * 3;
    x === cx - size * 0.15 ? ctx.moveTo(x, sy) : ctx.lineTo(x, sy);
  }
  ctx.strokeStyle = ember(0.2 + Math.sin(time * 1.2) * 0.08);
  ctx.lineWidth = 1;
  ctx.stroke();

  // Infinity symbol at very center-bottom — the dual cycle, one being
  const infCx = cx;
  const infCy = cy + size * 0.15;
  const infW = size * 0.04;
  const infH = size * 0.015;
  ctx.beginPath();
  for (let t = 0; t < Math.PI * 2; t += 0.05) {
    const x = infCx + infW * Math.cos(t) / (1 + Math.sin(t) * Math.sin(t));
    const y = infCy + infH * Math.sin(t) * Math.cos(t) / (1 + Math.sin(t) * Math.sin(t));
    t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = gold(0.4 + Math.sin(time * 1.5) * 0.15);
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

// ═══════════════════════════════════════════════════════
// Animation Loop
// ═══════════════════════════════════════════════════════

let startTime = null;

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const time = (timestamp - startTime) / 1000;

  courtMembers.forEach(member => {
    member.draw(member.ctx, member.cx, member.cy, member.size, time);
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
